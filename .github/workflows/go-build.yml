name: Go Build Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 1.23.4-2)"
        required: true
        type: string

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    strategy:
      matrix:
        target:
          - windows_amd64
          - windows_arm64
          - windows_386
          - darwin_amd64
          - darwin_arm64
          - linux_amd64
          - linux_arm64
          - linux_arm
          - linux_386

    steps:
      - name: Resolve source branch
        id: branch
        run: |
          VERSION="${{ inputs.version }}"
          MAJOR_MINOR=$(echo "$VERSION" | grep -oP '^\d+\.\d+')

          BRANCHES=$(git ls-remote --heads https://github.com/${{ github.repository }} | awk '{print $2}' | sed 's|refs/heads/||')

          RELEASE_BRANCH="release-branch.go${MAJOR_MINOR}"

          if echo "$BRANCHES" | grep -qx "$RELEASE_BRANCH"; then
            echo "branch=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
            echo "Checking out $RELEASE_BRANCH for version $VERSION"
          else
            echo "branch=main" >> $GITHUB_OUTPUT
            echo "No release branch found for $MAJOR_MINOR, falling back to main"
          fi

      - uses: actions/checkout@v7
        with:
          path: go-legacy-win7
          ref: ${{ steps.branch.outputs.branch }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: "go-legacy-win7/src/go.mod"
          cache: false

      - name: Set execute permissions
        run: |
          chmod +x go-legacy-win7/src/make.bash

      - name: Build Go toolchain
        env:
          GOOS: ${{ startsWith(matrix.target, 'windows_') && 'windows' || startsWith(matrix.target, 'darwin_') && 'darwin' || 'linux' }}
          GOARCH: ${{ endsWith(matrix.target, '_386') && '386' || endsWith(matrix.target, '_amd64') && 'amd64' || endsWith(matrix.target, '_arm64') && 'arm64' || 'arm' }}
          CGO_ENABLED: ${{ matrix.target == 'linux_amd64' && '0' || '' }}
        run: |
          cd go-legacy-win7/src
          ./make.bash --no-banner

      - name: Create release directory
        run: |
          mkdir -p release
          cp -r go-legacy-win7 release/
          cd release/go-legacy-win7

          # Remove development files
          rm -rf .git*
          rm -rf codereview.cfg
          rm -rf patches
          rm -rf installer
          rm -rf test
          rm -rf src/**/*_test.go
          rm -rf src/**/testdata
          rm -rf doc
          rm -rf misc
          rm -rf src/*.bash
          rm -rf src/*.bat
          rm -rf src/*.rc
          rm -rf src/make.*
          rm -rf src/run.*
          rm -rf *.md

          # Process binaries
          cd bin
          if [ "${{ matrix.target }}" != "linux_amd64" ]; then
            rm -f go gofmt
          fi
          if [ -d "${{ matrix.target }}" ]; then
            mv ${{ matrix.target }}/* ./
          fi
          rm -rf */

          # Clean up pkg folder
          cd ../pkg
          find . -mindepth 1 -maxdepth 1 -type d ! \( -name "include" -o -name "tool" \) -exec rm -rf {} +

          # Clean up pkg/tool folder
          cd tool
          find . -mindepth 1 -maxdepth 1 -type d ! -name "${{ matrix.target }}" -exec rm -rf {} +

      - name: Package
        run: |
          cd release
          if [[ "${{ matrix.target }}" == windows_* ]]; then
            zip -r ../go-legacy-win7-${{ inputs.version }}.${{ matrix.target }}.zip .
          else
            tar -czf ../go-legacy-win7-${{ inputs.version }}.${{ matrix.target }}.tar.gz .
          fi

      - name: Upload Windows zip for the MSI build
        if: matrix.target == 'windows_amd64'
        uses: actions/upload-artifact@v7
        with:
          name: go-legacy-win7-windows_amd64
          path: go-legacy-win7-${{ inputs.version }}.windows_amd64.zip
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 1

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          cd go-legacy-win7

          git config --global user.email "actions@github.com"
          git config --global user.name "GitHub Actions"

          git fetch --tags
          if ! git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            git tag -a "v${{ inputs.version }}" -m "go-legacy-win7-${{ inputs.version }}"
            git push origin "v${{ inputs.version }}"
          fi

          gh release view v${{ inputs.version }} || \
          gh release create v${{ inputs.version }} \
            --title "go-legacy-win7-${{ inputs.version }}" \
            --notes "go-legacy-win7-${{ inputs.version }}" \
            --draft \
            --target ${{ steps.branch.outputs.branch }}

          gh release upload v${{ inputs.version }} \
            ../go-legacy-win7-${{ inputs.version }}.${{ matrix.target }}.* \
            --clobber

  # WiX cannot build MSI packages on Linux, so this job consumes the
  # windows_amd64 release zip from the build matrix on a Windows runner.
  msi:
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.RELEASE_TOKEN || github.token }}

      - name: Download Windows zip
        uses: actions/download-artifact@v8
        with:
          name: go-legacy-win7-windows_amd64

      - name: Install WiX
        shell: pwsh
        run: |
          dotnet tool install --global wix --version 6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $wix = Join-Path $env:USERPROFILE ".dotnet\tools\wix.exe"
          & $wix extension add -g WixToolset.UI.wixext/6.0.2
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build MSI
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -LiteralPath "go-legacy-win7-${{ inputs.version }}.windows_amd64.zip" -DestinationPath release -Force
          pwsh -NoProfile -ExecutionPolicy Bypass -File .\installer\wix\build.ps1 `
            -SourceDir release\go-legacy-win7 -Version "${{ inputs.version }}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Attach MSI to the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN || github.token }}
        run: |
          gh release upload "v${{ inputs.version }}" `
            "go-legacy-win7-${{ inputs.version }}.windows_amd64.msi" `
            --clobber --repo "${{ github.repository }}"
